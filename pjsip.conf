[transport-udp]
type=transport
protocol=udp
bind=your-ip-adress:5060    

; Шаблон для endpoint
[1](!)
type=endpoint
transport=transport-udp
context=internal         
disallow=all
allow=ulaw
allow=alaw

; Шаблон для аутентификации
[1a](!)
type=auth
auth_type=userpass

; Шаблон для AOR
[10](!)
type=aor
max_contacts=1
qualify_frequency=30
