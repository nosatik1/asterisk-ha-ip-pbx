[general]
persistentmembers = yes          ; сохранять динамических членов очереди
monitor-type = MixMonitor         ; тип записи разговоров

[support1]
musicclass=default
strategy=ringall
timeout=20                         ; таймаут на ответ агента (сек)
joinempty=yes                      ; разрешить вход в очередь, если нет аген-тов?
leavewhenempty=yes                 ; покидать очередь, если нет агентов?
retry=5                            ; повтор через 5 сек при отсутствии ответа
wrapuptime=5                       ; время отдыха агента после звонка (сек)
announce-frequency=60              ; объявлять позицию каждые 60 сек
announce-position=yes
announce-holdtime=yes
periodic-announce=thanks-for-waiting
periodic-announce-frequency=90

[support2]
strategy=leastrecent
timeout=20
joinempty=yes
leavewhenempty=yes
retry=5
wrapuptime=5

[support3]
strategy=fewestcalls
timeout=20
joinempty=yes
leavewhenempty=yes
retry=5
wrapuptime=5
