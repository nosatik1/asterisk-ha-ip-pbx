; ========== Очередь support1 (только 1XXX) ==========
exten => *411,1,Verbose(2, Agent ${CALLERID(num)} logging into queue support1)
 same => n,GotoIf($[${CALLERID(num):0:1}=1]?allow)
 same => n,Playback(im-sorry)
 same => n,Hangup()
 same => n(allow),AddQueueMember(support1, Local/${CALLERID(num)}@internal)
 same => n,Playback(agent-loginok)
 same => n,Hangup()

exten => *511,1,Verbose(2, Agent ${CALLERID(num)} logging out of queue sup-port1)
 same => n,RemoveQueueMember(support1, Local/${CALLERID(num)}@internal)
 same => n,Playback(agent-loggedoff)
 same => n,Hangup()

